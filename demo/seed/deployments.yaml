# Deployments in various states of distress, plus one healthy control.
# Each failure mode maps to a distinct `kx diag` finding.
---
# Healthy control — safe to delete its pods (the ReplicaSet recreates them).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-healthy
  namespace: diagnostics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-healthy
  template:
    metadata:
      labels:
        app: web-healthy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# ImagePullBackOff — image registry does not exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-badimage
  namespace: diagnostics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-badimage
  template:
    metadata:
      labels:
        app: api-badimage
    spec:
      containers:
        - name: api
          image: registry.invalid/does-not-exist:latest
---
# CrashLoopBackOff — exits shortly after starting, forever.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-crashloop
  namespace: diagnostics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-crashloop
  template:
    metadata:
      labels:
        app: worker-crashloop
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              echo starting; sleep 2;
              echo "ERROR: worker boot failed: connection refused to db:5432";
              echo "FATAL: exiting"; exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
# OOMKilled — allocates past its 32Mi memory limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-oom
  namespace: diagnostics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-oom
  template:
    metadata:
      labels:
        app: cache-oom
    spec:
      containers:
        - name: cache
          image: busybox:1.36
          command: ["sh", "-c", "dd if=/dev/zero of=/dev/shm/fill bs=1M"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
# Running but never Ready — readiness probe hits a 404.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-notready
  namespace: diagnostics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-notready
  template:
    metadata:
      labels:
        app: frontend-notready
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# Unschedulable — requests 1000 CPUs; no node can satisfy it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-unschedulable
  namespace: diagnostics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-unschedulable
  template:
    metadata:
      labels:
        app: report-unschedulable
    spec:
      containers:
        - name: report
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: "1000"
              memory: 16Mi
---
# Flaky boot — fails its first 5 starts, then stabilizes with restarts on record.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-flaky
  namespace: diagnostics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-flaky
  template:
    metadata:
      labels:
        app: billing-flaky
    spec:
      containers:
        - name: billing
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              n=$(cat /state/n 2>/dev/null || echo 0); n=$((n+1)); echo $n > /state/n;
              if [ $n -le 5 ]; then echo "boot attempt $n failing"; exit 1; fi;
              echo "stable after $n boots"; sleep 100000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          emptyDir: {}
