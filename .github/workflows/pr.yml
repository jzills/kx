name: PR Validation

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./tools)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race because the spinner is the one thing in kx that runs concurrently,
      # and a data race there would otherwise only ever show up on a user's
      # terminal.
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      # A ratchet, not a target. Raise it when coverage rises; never lower it to
      # make a change fit. The floor is deliberately just under the current
      # number so it blocks backsliding without failing the PR that sets it.
      #
      # Not comparable to the 78% the Python suite gated at: that counted lines
      # and this counts statements. Packages with no test files (cmd/kx,
      # internal/k8s, internal/kubectl, internal/tree, tools/) are in the
      # denominator at 0%, so the number reflects the whole module.
      - name: Check coverage
        env:
          FLOOR: "62.0"
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "total coverage: ${total}% (floor ${FLOOR}%)"
          if awk "BEGIN { exit !($total < $FLOOR) }"; then
            echo "::error::coverage ${total}% is below the ${FLOOR}% floor"
            exit 1
          fi

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Its own job so a vulnerability reads as a vulnerability rather than as a
      # test failure. govulncheck reports only what kx actually calls, so the
      # transitive graph being large doesn't make this noisy — three reachable
      # CVEs sat in client-go's x/net and x/text pins through the whole Go port
      # with nothing looking for them.
      #
      # This can fail on a PR that changed nothing relevant, when a CVE is newly
      # disclosed against a dependency already in the tree. That is the check
      # working: the fix is to bump the dependency, not to skip the run.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup pre-commit
        run: pipx install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the same hooks as local commits: gofmt, go vet, and the README
      # command-table generator. Fails if any hook reports changes, which is
      # what catches a README table left stale by a command change.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
