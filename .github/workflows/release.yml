name: Release

on:
  push:
    branches:
      - 'release/**'

jobs:
  # Everything this job does is disposable: it writes nothing outside the
  # runner, so a release abandoned at the approval gate below leaves the
  # release branch exactly as it was pushed.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from branch name
        id: version
        run: |
          VERSION=$(bash .github/scripts/extract-version.sh "${GITHUB_REF#refs/heads/}")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # First, deliberately: a release whose summary nobody wrote is one this
      # gate should stop while stopping is still free. A missing file costs a
      # commit to the release branch, whose push re-runs this workflow from
      # the top.
      - name: Require a release summary
        run: |
          NOTES="release-notes/v${{ steps.version.outputs.value }}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing or empty."
            echo "Write the paragraph that opens the release notes, commit it"
            echo "to this release branch, and push again. See RELEASING.md."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      # Binaries first: the wheels package them, so unlike the PyInstaller
      # pipeline the PyPI publish now depends on the build rather than
      # preceding it.
      - name: Cross-compile every target
        run: scripts/build_binaries.sh "${{ steps.version.outputs.value }}"

      - name: Verify the archives are krew-installable
        run: |
          for archive in dist/kx_v*.tar.gz; do
            extract="$RUNNER_TEMP/$(basename "$archive" .tar.gz)"
            mkdir -p "$extract"
            tar -C "$extract" -xzf "$archive"
            if [ -n "$(find "$extract" -type l)" ]; then
              echo "$archive contains symlinks, which krew cannot extract:"
              find "$extract" -type l
              exit 1
            fi
            test -x "$extract/kx/kx" || { echo "$archive has no executable at kx/kx"; exit 1; }
            # krew-index refuses a plugin whose archive carries no license. The
            # PyInstaller bundles satisfied this by accident, so v0.1.0 was the
            # first release to trip it — at krew-index rather than here.
            test -f "$extract/kx/LICENSE" || { echo "$archive has no kx/LICENSE"; exit 1; }
          done

      # Windows ships as .zip and krew never selects it, so it is checked for
      # its own layout rather than krew's.
      - name: Verify the Windows archives
        run: |
          for archive in dist/kx_v*_windows_*.zip; do
            test -f "$archive" || { echo "no Windows archives were built"; exit 1; }
            python3 -m zipfile -l "$archive" | grep -q 'kx/kx\.exe' || {
              echo "$archive has no kx/kx.exe"; exit 1; }
            python3 -m zipfile -l "$archive" | grep -q 'kx/LICENSE' || {
              echo "$archive has no kx/LICENSE"; exit 1; }
          done

      - name: Check the bundled version matches the release
        run: |
          # First line only: --version also reports commit, build date and
          # toolchain below it, none of which the release name pins. The "v" is
          # kx's, not the branch's — extract-version.sh strips it, and the
          # version line puts it back the way a tag spells it.
          ACTUAL="$(./dist/binaries/kx_linux_amd64/kx --version | head -1)"
          EXPECTED="kx v${{ steps.version.outputs.value }}"
          test "$ACTUAL" = "$EXPECTED" || { echo "expected '$EXPECTED', got '$ACTUAL'"; exit 1; }

      # build_wheels.py takes the version as an argument and reads only the
      # name, description and readme out of pyproject.toml, so the wheels are
      # stamped correctly without the file being edited first. The edit that
      # keeps the repo's recorded version honest belongs to the publish job.
      - name: Build wheels
        run: python3 scripts/build_wheels.py --version "${{ steps.version.outputs.value }}" --binaries dist/binaries

      # An installed wheel whose binary lost its executable bit passes every
      # structural check and still fails at the prompt, so the installed
      # command is run before anything is published.
      - name: Install a wheel and run the installed binary
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            "dist/wheels/kx_cli-${{ steps.version.outputs.value }}-py3-none-manylinux_2_17_x86_64.whl"
          "$RUNNER_TEMP/venv/bin/kx" --version

      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: |
            dist/kx_v*.tar.gz
            dist/kx_v*.zip
          if-no-files-found: error

      # Carried across the gate rather than rebuilt after it, so what is
      # published is the artifact the checks above actually passed.
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: release-wheels
          path: dist/wheels/*.whl
          if-no-files-found: error

  # The approval gate. Everything from here on writes somewhere that does not
  # come back cleanly — PyPI refuses a re-upload, and the tag, the release and
  # the pull requests below all follow from this job. The `release`
  # environment carries the required-reviewer rule; the job does not start
  # until a reviewer approves the run.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The default GITHUB_TOKEN can't push the version-bump commit below:
      # release/** is protected by the restrict-release ruleset, and that
      # bypasses only a specific user, not the github-actions bot (Integration
      # bypass actors require an org-owned repo, which this isn't). RELEASE_PAT
      # is a fine-grained PAT for this repo (Contents: read and write) issued
      # under that user's account, so the push authenticates as an actor the
      # ruleset already trusts.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PAT }}

      # The binary carries its version through -ldflags, so pyproject.toml is
      # stamped only to keep the repo's recorded version honest and to supply
      # the wheel metadata's name and description.
      - name: Set version in pyproject.toml
        run: |
          sed -i "s/^version = .*/version = \"${{ needs.build.outputs.version }}\"/" pyproject.toml

      # [skip ci] matters here specifically because this pushes with
      # RELEASE_PAT rather than the default GITHUB_TOKEN: GitHub only
      # suppresses on-push retriggering for the built-in token, so a PAT
      # push to release/** would otherwise kick off a second run of this
      # same workflow, which fails at this exact step ("nothing to commit")
      # since the version was already bumped by the first run.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ needs.build.outputs.version }} [skip ci]"
          git push origin "${{ github.ref_name }}"

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: release-wheels
          path: dist/wheels

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python3 -m pip install --quiet twine
          python3 -m twine check dist/wheels/*.whl
          python3 -m twine upload --skip-existing dist/wheels/*.whl

  tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}"

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish, tag]
    permissions:
      contents: write
      actions: write
    steps:
      # Needed for .krew.yaml, which the validation below renders, and for
      # release-notes/, which the notes are built from.
      #
      # fetch-depth: 0 because gen-release-notes reads the tag list and the
      # commit range between the last two releases. The default shallow clone
      # carries neither, and would produce empty notes rather than an error.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Staged outside the workspace. "assets" is a real directory in this
      # repository — the banner and the screenshots the README embeds — so
      # downloading the archives into it merged the two, and the upload below,
      # which takes a glob, shipped those five images with every release from
      # v0.0.6 to v0.5.2. RUNNER_TEMP cannot collide with a tracked path,
      # which a differently-named directory in the workspace could again.
      #
      # Named, not merge-multiple: the run also carries the wheels the publish
      # job consumed, and an unnamed download would stage those here too.
      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: ${{ runner.temp }}/release-assets

      - name: Generate checksums
        run: cd "$RUNNER_TEMP/release-assets" && sha256sum *.tar.gz *.zip > SHA256SUMS

      # The upload is a glob, so what the staging directory holds is what the
      # release ships. Checked rather than assumed, because the last thing to
      # put a stray file there did it silently for fifteen releases.
      - name: Check nothing but the release is staged
        run: |
          cd "$RUNNER_TEMP/release-assets"
          unexpected=$(ls | grep -vE '^(kx_v.*\.(tar\.gz|zip)|SHA256SUMS)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::staging directory holds files that are not release artifacts:"
            echo "$unexpected"
            exit 1
          fi
          echo "staged for upload:"
          ls

      # Three tiers: the paragraph from release-notes/, bullets derived from
      # what merged, then GitHub's own commit list — still generated by GitHub
      # rather than rebuilt here, so the detail tier is exactly what
      # --generate-notes would have produced on its own.
      - name: Assemble the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./tools/gen-release-notes \
            --version "${{ needs.build.outputs.version }}" \
            --out "$RUNNER_TEMP/notes.md"
          echo "--- notes as published ---"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            "$RUNNER_TEMP"/release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${{ needs.build.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # krew-index runs exactly this validator on the PR the dispatch below
      # opens, and it is stricter than anything we can check before publishing:
      # it installs every platform for real and inspects what lands. v0.1.0
      # passed our own pre-release checks and was then rejected upstream for
      # shipping no license file, where it sat as a stuck external PR nobody
      # was watching.
      #
      # This still runs after the release is published — the validator needs
      # downloadable assets with real sha256s, so it cannot run earlier. What
      # it buys is finding out in our own pipeline within a minute rather than
      # from a PR on someone else's repository.
      - name: Validate the manifest krew-index will receive
        env:
          KREW_VERSION: v0.4.5
        run: |
          set -euo pipefail
          tag="v${{ needs.build.outputs.version }}"

          # The bot's own renderer, so the manifest under test is the one it
          # will submit rather than our approximation of it.
          docker run --rm -v "$PWD:/home/app" \
            "ghcr.io/rajatjindal/krew-release-bot:v0.0.50" \
            krew-release-bot template --tag "$tag" --template-file .krew.yaml > idx.yaml
          cat idx.yaml

          # validate-krew-manifest drives `kubectl krew install`, so krew has to
          # be on PATH. Same setup krew-index's own CI uses.
          pushd "$(mktemp -d)"
          curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/download/${KREW_VERSION}/krew.yaml"
          curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/download/${KREW_VERSION}/krew-linux_amd64.tar.gz"
          tar zxf krew-linux_amd64.tar.gz
          ./krew-linux_amd64 install --manifest=krew.yaml --archive=krew-linux_amd64.tar.gz
          popd
          export PATH="${KREW_ROOT:-$HOME/.krew}/bin:$PATH"

          go run "sigs.k8s.io/krew/cmd/validate-krew-manifest@${KREW_VERSION}" -manifest idx.yaml

      # Dispatch the Krew workflow at the new tag so krew-release-bot derives the
      # version from GITHUB_REF and opens a PR to kubernetes-sigs/krew-index
      # (plugin "idx"). Explicit workflow_dispatch — not on: push tags — because
      # the tag is pushed with GITHUB_TOKEN, which never triggers downstream
      # workflows. Requires this job's actions: write permission.
      - name: Trigger krew-index update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run krew.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "v${{ needs.build.outputs.version }}"

  merge:
    name: Open PR to Main
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release v${{ needs.build.outputs.version }}" \
            --body "Automated release PR for v${{ needs.build.outputs.version }}. Package published to PyPI successfully." \
            --base main \
            --head "${{ github.ref_name }}")
          # --auto errors when the PR is already in clean status (nothing
          # pending to wait on); merge directly in that case.
          gh pr merge "$PR_URL" --merge --auto || gh pr merge "$PR_URL" --merge

  merge-back:
    name: Merge Release Back to Develop
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create PR to merge release branch back into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(gh api repos/$GITHUB_REPOSITORY/compare/develop...${{ github.ref_name }} --jq '.ahead_by')
          if [ "$AHEAD" -eq 0 ]; then
            echo "No commits to merge back — branches are already in sync."
            exit 0
          fi
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "chore: merge ${{ github.ref_name }} back into develop" \
            --body "Automated post-release merge. Brings release fixes from \`${{ github.ref_name }}\` back into \`develop\` to keep branches in sync." \
            --base develop \
            --head "${{ github.ref_name }}")
          # --auto errors when the PR is already in clean status (nothing
          # pending to wait on); merge directly in that case.
          gh pr merge "$PR_URL" --merge --auto || gh pr merge "$PR_URL" --merge
