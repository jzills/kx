version: 2
updates:
  # kx is a Go program. The transitive graph is the part that needs watching:
  # client-go pins golang.org/x/net and x/text, and nothing else in the repo
  # would ever propose a bump for them.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # The kubectl flag table's generator, its own module so kubectl's command
  # code stays out of kx's go.mod. A bump here moves the kubectl release the
  # table describes; the gen-kubectl-flags hook fails the PR until the table is
  # regenerated to match. The k8s.io modules are version-locked siblings that
  # do not build as a mixed set, so they move as one PR.
  - package-ecosystem: "gomod"
    directory: "/tools/gen-kubectl-flags"
    schedule:
      interval: "weekly"
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
