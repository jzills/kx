# Hugo configuration for the kx site.
#
# A landing page at / and the documentation under /docs/. The docs layout is
# Hextra's own — adding content/docs/ is what turned on the sidebar, the
# right-hand table of contents and the search below.
# j.zills.io is the custom domain on the owner's user site, which GitHub Pages
# applies to this project site too; jzills.github.io/kx/ answers with a 301 to
# it, so it is not the canonical URL. The install script keeps its
# jzills.github.io address, which curl -L follows and which is printed in
# READMEs and release notes already out there.
baseURL = "https://j.zills.io/kx/"
# The tagline rather than the name, because this is the browser tab's text and
# the tab already carries the mark as its favicon: "kx" beside a kx logo says
# the same thing twice, where the tagline says what kx is. Hextra titles the
# home page with this alone and every other page as "Page – this", so the
# tagline closes both.
title = "kubectl, indexed."
# No tag or category pages: no page has either, so Hugo's default /tags/ and
# /categories/ were empty, and listed in the sitemap they were indexed as thin
# pages.
disableKinds = ["taxonomy", "term"]
[languages.en]
  label = "English"

# The site is its own Hugo module so Hextra never enters the CLI's go.mod,
# where it would show up in Dependabot runs and the vulnerability gate.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  # Nothing from the repo root is published. The README's single-theme GIFs
  # and screenshots are for GitHub, which cannot theme anything; the site keeps
  # its own per-palette set under static/, and mounting the README's as well
  # would publish several megabytes nothing links to.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  # Mounted a second time so resources.Get can read the generated favicon:
  # head-end.html inlines it to repaint the tab icon per palette, and a
  # second copy of the file under assets/ is a copy that can go stale.
  [[module.mounts]]
    source = "static"
    target = "assets"

  # Read, not published: the release notes page renders each paragraph from
  # release-notes/, and stops at the latest version, which pyproject.toml
  # names. release.yml stamps that file only when a release publishes, so a
  # paragraph written ahead of its release stays off the site until then. Both are mounted under assets/ rather than
  # copied into site/, because a copy goes stale with every release.
  [[module.mounts]]
    source = "../release-notes"
    target = "assets/release-notes"
  [[module.mounts]]
    source = "../pyproject.toml"
    target = "assets/pyproject.toml"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    # The landing page is hand-written HTML in a markdown file: hero, install
    # cards, feature grid. Goldmark drops raw HTML unless told otherwise.
    unsafe = true

  # The typographer stays on for quotes, but its dash substitutions are
  # neutralized: it rewrites "--" as an en dash, which turned every flag named
  # in prose into "–decode" and "–all-namespaces". Fifteen cells of the
  # generated command reference were affected. Setting the replacements to the
  # literal characters is narrower than disabling the extension, which would
  # also give up the curly quotes.
  [markup.goldmark.extensions.typographer]
    enDash = "--"
    emDash = "---"

[params]
  description = "kubectl, indexed. Select Kubernetes resources by number instead of typing names."

  # Both off: layouts/_partials/custom/navbar-title.html draws the mark
  # itself, inlined so it takes its color from the active palette.
  [params.navbar]
    displayTitle = false
    displayLogo = false
    width = "normal"

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false
    width = "normal"

  # The page, navbar and footer widths, stated on every project docs site so
  # their columns line up when you move from one to the next. Hextra's
  # default is "normal" (80rem); a site left on "wide" drew its footer 10rem
  # wider than its siblings'.
  [params.page]
    width = "normal"

  [params.search]
    enable = true

    [params.search.flexsearch]
      # Vendored rather than fetched. Hextra's default pulls the bundle from
      # jsDelivr with resources.GetRemote and republishes it locally, so the
      # published page is self-hosted either way — but the *build* then needs
      # the network, and a jsDelivr blip would fail a deploy that has nothing
      # to do with jsDelivr. Committing the file is also what the repo already
      # does with third-party JavaScript; see THIRD_PARTY_NOTICES.md, which
      # this bundle is listed in beside Tabulator.
      #
      # Setting js alone is enough to take the local-asset branch of the
      # theme's scripts/search.html; base is only for a different CDN.
      js = "vendor/flexsearch/flexsearch.bundle.min.js"

  # The light/dark button is the one in the navbar, a menu entry of type
  # theme-toggle below. It renders layouts/_partials/theme-toggle.html: a
  # button that switches between kx palettes, not Hextra's own switch, which
  # knows nothing of them. The full palette list is on the landing page. With
  # nothing stored, the reader's system setting picks light or dark;
  # "default" is only Hextra's first guess, which assets/js/kx-theme.js
  # corrects before the page paints.
  #
  # displayToggle is off because it governs a second copy of that button, in
  # a sticky bar at the foot of the sidebar — on a docs page a lone moon in
  # an otherwise empty column, under a divider the width of the sidebar,
  # doing what the one in the navbar overhead already does. The navbar's is
  # a menu entry and is not affected by this.
  [params.theme]
    default = "dark"
    displayToggle = false

# The bar holds a first visitor's top tasks, the same on each of the project
# sites: Documentation, Quickstart, Releases, Search, GitHub and the
# light/dark button. Documentation keeps the docs section's own title, so the
# bar and the breadcrumb under it name the section the same way.
# The footer already covers the rest (Get started, Learn, Project).
# Quickstart replaced Install, which overlapped it: the quickstart opens with
# the install. Releases is there because kx ships often, and was otherwise
# linked only from the footer. A menu of the landing page's own sections read
# as a table of contents, and "Themes" left too; its palettes are a scroll
# away on the landing page, and the bar keeps only a light/dark button.
# The footer, shared by every project docs site: the markup is
# layouts/_partials/custom/footer.html. Keys are lowercase, as Hugo stores
# them. A link is a site `path`, an absolute `url`, or kind = "bug",
# which opens a new issue with `bug` as its body; the body asks for
# kx --version's output, because the site can't know which binary the reader
# runs.
[params.oss]
  name = "kx"
  mark = "kx-mark.svg"
  showname = false
  tagline = "kubectl, indexed. Every row of a listing gets a number, and every other command takes it."
  repo = "https://github.com/jzills/kx"
  bug = """**What happened**


**What you expected**


**Steps to reproduce**

```
kx ...
```

**Version**

Paste the output of `kx --version`.
"""

  # Four links per column, labels of 19 characters or fewer, and a tagline
  # of two lines on every project docs site, so the footers are the same
  # height wherever a reader is.
  [[params.oss.columns]]
    heading = "Get started"
    links = [
      { label = "Install", path = "docs/getting-started/install/" },
      { label = "Quickstart", path = "docs/getting-started/quickstart/" },
      { label = "Command reference", path = "docs/reference/commands/" },
      { label = "Configuration", path = "docs/concepts/configuration/" },
    ]
  [[params.oss.columns]]
    heading = "Learn"
    links = [
      { label = "Concepts", path = "docs/concepts/" },
      { label = "Guides", path = "docs/guides/" },
      { label = "Agents and MCP", path = "docs/guides/use-kx-from-an-agent/" },
      { label = "Docs for agents", path = "llms.txt" },
    ]
  [[params.oss.columns]]
    heading = "Project"
    links = [
      { label = "GitHub", url = "https://github.com/jzills/kx" },
      { label = "Release notes", path = "releases/" },
      { label = "Report a bug", kind = "bug" },
      { label = "MIT license", url = "https://github.com/jzills/kx/blob/main/LICENSE" },
    ]

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Quickstart"
    pageRef = "/docs/getting-started/quickstart"
    weight = 2
  [[menu.main]]
    name = "Releases"
    pageRef = "/releases"
    weight = 3
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/jzills/kx"
    weight = 5
    [menu.main.params]
      icon = "github"
  # The light/dark button; see params.theme above.
  [[menu.main]]
    name = "Theme"
    weight = 6
    [menu.main.params]
      type = "theme-toggle"
