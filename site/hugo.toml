# Hugo configuration for the kx site.
#
# A landing page at / and the documentation under /docs/. The docs layout is
# Hextra's own — adding content/docs/ is what turned on the sidebar, the
# right-hand table of contents and the search below.
baseURL = "https://jzills.github.io/kx/"
# The tagline rather than the name, because this is the browser tab's text and
# the tab already carries the mark as its favicon: "kx" beside a kx logo says
# the same thing twice, where the tagline says what kx is. Hextra titles the
# home page with this alone and every other page as "Page – this", so the
# tagline closes both.
title = "kubectl, indexed."
[languages.en]
  label = "English"

# The site is its own Hugo module so Hextra never enters the CLI's go.mod,
# where it would show up in Dependabot runs and the vulnerability gate.
[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  # Nothing from the repo root is published. The README's single-theme GIFs
  # and screenshots are for GitHub, which cannot theme anything; the site keeps
  # its own per-palette set under static/, and mounting the README's as well
  # would publish several megabytes nothing links to.
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  # Mounted a second time so resources.Get can read the generated favicon:
  # head-end.html inlines it to repaint the tab icon per palette, and a
  # second copy of the file under assets/ is a copy that can go stale.
  [[module.mounts]]
    source = "static"
    target = "assets"

  # Read, not published: the release notes page renders each paragraph from
  # release-notes/, and stops at the latest version, which pyproject.toml
  # names. release.yml stamps that file only when a release publishes, so a
  # paragraph written ahead of its release stays off the site until then. Both are mounted under assets/ rather than
  # copied into site/, because a copy goes stale with every release.
  [[module.mounts]]
    source = "../release-notes"
    target = "assets/release-notes"
  [[module.mounts]]
    source = "../pyproject.toml"
    target = "assets/pyproject.toml"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    # The landing page is hand-written HTML in a markdown file: hero, install
    # cards, feature grid. Goldmark drops raw HTML unless told otherwise.
    unsafe = true

  # The typographer stays on for quotes, but its dash substitutions are
  # neutralized: it rewrites "--" as an en dash, which turned every flag named
  # in prose into "–decode" and "–all-namespaces". Fifteen cells of the
  # generated command reference were affected. Setting the replacements to the
  # literal characters is narrower than disabling the extension, which would
  # also give up the curly quotes.
  [markup.goldmark.extensions.typographer]
    enDash = "--"
    emDash = "---"

[params]
  description = "kubectl, indexed. Select Kubernetes resources by number instead of typing names."

  # Both off: layouts/_partials/custom/navbar-title.html draws the mark
  # itself, inlined so it takes its color from the active palette.
  [params.navbar]
    displayTitle = false
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

  [params.search]
    enable = true

    [params.search.flexsearch]
      # Vendored rather than fetched. Hextra's default pulls the bundle from
      # jsDelivr with resources.GetRemote and republishes it locally, so the
      # published page is self-hosted either way — but the *build* then needs
      # the network, and a jsDelivr blip would fail a deploy that has nothing
      # to do with jsDelivr. Committing the file is also what the repo already
      # does with third-party JavaScript; see THIRD_PARTY_NOTICES.md, which
      # this bundle is listed in beside Tabulator.
      #
      # Setting js alone is enough to take the local-asset branch of the
      # theme's scripts/search.html; base is only for a different CDN.
      js = "vendor/flexsearch/flexsearch.bundle.min.js"

  # displayToggle is on, but the control it shows is layouts/_partials/
  # theme-toggle.html — the kx palette menu, not Hextra's light/dark switch.
  # See that file for why the two can't coexist: ours knows all ten palettes,
  # two of which are light, and a second control that only knew "light" and
  # "dark" would disagree with the one that knows the rest.
  [params.theme]
    default = "dark"
    displayToggle = true

# Docs leads, then Install, the one landing-page section a reader comes back
# for. The page's other sections are a scroll away and no longer each take a
# slot in the bar: a menu of five fragments read as a table of contents,
# where the tools this site is laid out like name a handful of destinations.
# "Themes" left earlier: the palette menu at the end of this bar is that
# section's control, on every page rather than one.
[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Install"
    pageRef = "/#install"
    weight = 2
  [[menu.main]]
    name = "Search"
    weight = 3
    [menu.main.params]
      type = "search"
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/jzills/kx"
    weight = 4
    [menu.main.params]
      icon = "github"
  # The kx palette menu; see params.theme above.
  [[menu.main]]
    name = "Theme"
    weight = 5
    [menu.main.params]
      type = "theme-toggle"
