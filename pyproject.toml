# Release metadata for the PyPI distribution.
#
# kx is a Go program. This file declares no dependencies and no build backend:
# the published wheels carry a prebuilt static binary and are assembled by
# scripts/build_wheels.py, which reads only the fields below. `pip install
# kx-cli` therefore installs one executable and nothing else.
#
# The version is stamped here by release.yml so the repo records what was
# released; the binary carries its own version through -ldflags.
[project]
name = "kx-cli"
version = "0.2.0"
description = "kubectl wrapper with index-based resource selection"
readme = "README.md"
