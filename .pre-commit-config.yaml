repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: gen-command-table
        name: Regenerate README command table
        language: system
        # Prefer the project's venv interpreter (which has the deps) when it
        # exists, so `git commit` works without activating it first; fall back
        # to `python` on PATH for CI, where deps live in the setup-python env
        # and there is no .venv directory.
        entry: sh -c 'if [ -x .venv/bin/python ]; then exec .venv/bin/python scripts/gen_command_table.py; else exec python scripts/gen_command_table.py; fi'
        pass_filenames: false
        always_run: true
