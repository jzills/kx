repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: sh -c 'unformatted="$(gofmt -l ./cmd ./internal ./tools)"; if [ -n "$unformatted" ]; then echo "gofmt would change:"; echo "$unformatted"; exit 1; fi'
        pass_filenames: false
        files: '\.go$'

      - id: go-vet
        name: go vet
        language: system
        entry: go vet ./...
        pass_filenames: false
        files: '\.go$'

      - id: gen-command-table
        name: Regenerate README command table
        language: system
        # Reads the command tree straight from internal/cli, so the table can't
        # drift from the commands it documents. Exits non-zero when it rewrites
        # the README, which is how pre-commit surfaces the change for staging.
        entry: go run ./tools/gen-command-table
        pass_filenames: false
        always_run: true
